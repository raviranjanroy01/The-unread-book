<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Unread Book: Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#fdf1f4;color:#5a3550}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#2b2a5e;color:#fff6e8;position:sticky;top:0;z-index:5}
header h1{font-size:1.05rem;margin:0 auto 0 0}
button,a.b{font:inherit;background:#fff;border:2px solid #f6c6d6;border-radius:10px;padding:6px 12px;cursor:pointer;color:#5a3550;text-decoration:none;font-size:.88rem}
button.pri{background:#f6c6d6;font-weight:700}button.del{border-color:#e08a9a}
nav{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap}nav button.on,.list button.on{background:#f6c6d6;font-weight:700}
#main{display:grid;grid-template-columns:230px 1fr;gap:14px;padding:0 14px 40px}
.list{display:flex;flex-direction:column;gap:6px;align-self:start}.list button{text-align:left}
.form{background:#fff;border:2px solid #f6c6d6;border-radius:16px;padding:14px;min-width:0}
.f{display:block;margin:8px 0}.f span{display:block;font-size:.82rem;margin-bottom:3px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;padding:7px;border:2px solid #f6c6d6;border-radius:9px;background:#fffafb}
textarea{min-height:70px}
fieldset{border:2px dashed #cdb8ee;border-radius:12px;margin:12px 0;padding:8px 12px}legend{font-weight:700;padding:0 6px}
.sub{background:#fdf1f4;border:1px solid #f6c6d6;border-radius:12px;padding:6px 12px;margin:8px 0}
.note{font-size:.85rem;opacity:.85}#msg{padding:0 14px;min-height:1.4em;font-weight:700}
@media(max-width:700px){#main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>The Unread Book: Editor</h1>
<button class="pri" id="pub">Publish to the game</button><a class="b" href="index.html" target="_blank">Play</a>
<button id="exp">Export JSON</button><button id="imp">Import JSON</button><button id="rs">Reset progress</button><button id="df">Restore default story</button>
<input type="file" id="file" accept="application/json" hidden></header>
<div id="msg" role="status"></div>
<nav id="nav"></nav><div id="main"></div>
<script src="story.js"></script>
<script>
const Q=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};
const toArr=o=>Object.entries(o||{}).map(([id,v])=>({id,...v})),toDict=a=>Object.fromEntries(a.map(({id,...v})=>[id,v]));
let ST=JSON.parse(JSON.stringify(loadStory())),A,tab="scenes",sel=0,dirty=false;
function setup(){A={scenes:toArr(ST.scenes),puzzles:toArr(ST.puzzles),worlds:toArr(ST.worlds).map(w=>({...w,sky1:w.sky[0],sky2:w.sky[1],kitten:(ST.kitten||{})[w.id]||[]}))};}
setup();
const KINDS="flower,stone,book,bottle,mushroom,lantern,envelope,star,lily,telescope,mailbox,butterfly,feather,page,panda,cat".split(",");
const TR="ink,ripple,petals,page,stars".split(",");
const SCH={
scene:[["id","Scene ID (no spaces)","t"],["world","World (sets the look)","sel:worlds"],["title","Title","t"],["text","Story text. {name} = your friend's name, {from} = your name","a"],["kitten","Kitten line when nothing is left to poke here (optional)","t"]],
variant:[["if","Show this text when flags are set (comma separated, ! means not)","csv"],["text","Replacement text","a"]],
obj:[["id","Object ID","t"],["label","Name (used by the kitten and screen readers)","t"],["kind","Look","sel:"+KINDS],["color","Color (optional, like #ff9ec4)","t"],["x","Horizontal position (0 to 1000)","n"],["y","Vertical position (0 to 600)","n"],["say","What happens or what it says","a"],["big","Show in a big card (good for letters)","b"],["get","Gives clues or flags (comma separated)","csv"],["need","Needs these flags first","csv"],["showIf","Only visible when these flags are set","csv"],["puzzle","Opens a puzzle","sel:puzzles"],["go","Takes you to scene","sel:scenes"]],
choice:[["text","Choice text","t"],["go","Leads to","sel:scenes"],["need","Needs these flags (comma separated)","csv"],["locked","Message when locked","t"],["set","Sets flags when chosen","csv"],["tr","Transition","sel:"+TR]],
puzzle:[["id","Puzzle ID (no spaces)","t"],["type","Type","sel:text,choice,sequence"],["prompt","Question or riddle","a"],["answers","Answers. Text: every accepted answer. Choice: the correct option. Sequence: the correct order. One per line","lines"],["options","Options for choice or sequence, one per line","lines"],["hints","Kitten hints, subtle to clear, one per line","lines"],["needs","Needs these flags before it can be tried","csv"],["locked","Message when it is not ready","t"],["wrong","Wrong answer message","t"],["win","Success message","t"],["reward","Gives flags or clues on success","csv"],["go","After solving, go to scene","sel:scenes"]],
world:[["id","World ID","t"],["name","Name","t"],["kind","Art style","sel:garden,library,pond,woods,clouds,observatory,meadow,final"],["tr","Transition into this world","sel:"+TR],["sky1","Sky top color","t"],["sky2","Sky bottom color","t"],["kitten","Kitten openers, one per line","lines"]]
};
function opts(t){const s=t.slice(4);if(s=="scenes")return["",...A.scenes.map(x=>x.id),"@restart"];if(s=="puzzles")return["",...A.puzzles.map(x=>x.id)];if(s=="worlds")return A.worlds.map(x=>x.id);return s.split(",");}
function fld(o,[k,l,t]){const w=el("label","f");w.append(el("span","",l));let i;
 if(t=="a"){i=el("textarea");i.value=o[k]||""}
 else if(t=="b"){i=el("input");i.type="checkbox";i.checked=!!o[k]}
 else if(t=="n"){i=el("input");i.type="number";i.value=o[k]??0}
 else if(t=="csv"){i=el("input");i.type="text";i.value=(o[k]||[]).join(", ")}
 else if(t=="lines"){i=el("textarea");i.value=(o[k]||[]).join("\n")}
 else if(t.startsWith("sel:")){i=el("select");opts(t).forEach(v=>{const p=el("option","",v||"(none)");p.value=v;i.append(p)});i.value=o[k]||""}
 else{i=el("input");i.type="text";i.value=o[k]||""}
 i.oninput=i.onchange=()=>{dirty=true;o[k]=t=="b"?i.checked:t=="n"?+i.value:t=="csv"?i.value.split(",").map(s=>s.trim()).filter(Boolean):t=="lines"?i.value.split("\n").map(s=>s.trim()).filter(Boolean):i.value;};
 w.append(i);return w;}
function form(h,o,s){s.forEach(f=>h.append(fld(o,f)))}
function sub(h,arr,sch,title,mk,name){const fs=el("fieldset");fs.append(el("legend","",title));
 arr.forEach((it,i)=>{const d=el("div","sub");d.append(el("b","",name(it,i)));form(d,it,sch);const r=el("button","del","Remove");r.onclick=()=>{arr.splice(i,1);dirty=true;view()};d.append(r);fs.append(d)});
 const a=el("button","","+ Add");a.onclick=()=>{arr.push(mk());dirty=true;view()};fs.append(a);h.append(fs);}
function view(){const m=Q("#main");m.innerHTML="";Q("#nav").innerHTML="";
 [["scenes","Scenes"],["puzzles","Puzzles"],["clues","Clues"],["worlds","Worlds"],["meta","Story"]].forEach(([k,n])=>{const b=el("button",tab==k?"on":"",n);b.onclick=()=>{tab=k;sel=0;view()};Q("#nav").append(b)});
 if(tab=="scenes"||tab=="puzzles"){const arr=A[tab],list=el("div","list");
  arr.forEach((it,i)=>{const b=el("button",i==sel?"on":"",it.id+(it.title?": "+it.title:""));b.onclick=()=>{sel=i;view()};list.append(b)});
  const add=el("button","","+ New "+(tab=="scenes"?"scene":"puzzle"));add.onclick=()=>{arr.push(tab=="scenes"?{id:"scene_"+(arr.length+1),world:A.worlds[0].id,title:"New scene",text:"",objects:[],choices:[]}:{id:"puzzle_"+(arr.length+1),type:"text",prompt:"",answers:[],hints:[]});sel=arr.length-1;dirty=true;view()};list.append(add);m.append(list);
  const f=el("div","form"),it=arr[sel];
  if(it){if(tab=="scenes"){form(f,it,SCH.scene);it.objects=it.objects||[];it.choices=it.choices||[];it.variants=it.variants||[];
    sub(f,it.variants,SCH.variant,"Text variants (change the text depending on earlier choices)",()=>({if:[],text:""}),(v,i)=>"Variant "+(i+1));
    sub(f,it.objects,SCH.obj,"Objects in this scene",()=>({id:"obj_"+(it.objects.length+1),label:"new thing",kind:"flower",x:500,y:480,say:""}),(o,i)=>o.label||o.id);
    sub(f,it.choices,SCH.choice,"Choices at the bottom",()=>({text:"New choice",go:""}),(c,i)=>c.text);
    if(it.id==ST.start)f.append(el("p","note","This is the starting scene."));}
   else form(f,it,SCH.puzzle);
   const d=el("button","del","Delete this "+(tab=="scenes"?"scene":"puzzle"));d.onclick=()=>{if(confirm("Delete "+it.id+"?")){arr.splice(sel,1);sel=0;dirty=true;view()}};f.append(d);}
  else f.append(el("p","","Nothing here yet."));m.append(f);}
 else{const f=el("div","form");m.style.gridTemplateColumns="1fr";
  if(tab=="clues"){f.append(el("p","note","One per line, written as: flag_id: what the journal says. Any flag can be a clue; it appears in the Journal once it is set."));const t=el("textarea");t.style.minHeight="320px";t.value=Object.entries(ST.clues||{}).map(([k,v])=>k+": "+v).join("\n");t.oninput=()=>{dirty=true;ST.clues={};t.value.split("\n").forEach(l=>{const i=l.indexOf(":");if(i>0)ST.clues[l.slice(0,i).trim()]=l.slice(i+1).trim()})};f.append(t)}
  if(tab=="worlds"){A.worlds.forEach(w=>{const d=el("div","sub");d.append(el("b","",w.name));form(d,w,SCH.world);f.append(d)});const a=el("button","","+ Add world");a.onclick=()=>{A.worlds.push({id:"world_"+(A.worlds.length+1),name:"New world",kind:"garden",tr:"ink",sky1:"#2b2a5e",sky2:"#d79ac0",kitten:[]});dirty=true;view()};f.append(a)}
  if(tab=="meta"){form(f,ST.meta,[["title","Book title","t"],["friendName","Your friend's name (used for {name})","t"],["from","Your name (used for {from})","t"]]);f.append(fld(ST,["start","Starting scene","sel:scenes"]));
   f.append(el("p","note","Progress and custom content live in this browser only. Use Export JSON to back up or move to another device, and Import JSON to restore it."))}
  m.append(f);}}
function build(){const o=JSON.parse(JSON.stringify(ST));o.scenes=toDict(A.scenes);o.puzzles=toDict(A.puzzles);o.worlds={};o.kitten={_:(ST.kitten||{})._||["Mrrp."]};A.worlds.forEach(({id,sky1,sky2,kitten,...w})=>{o.worlds[id]={...w,sky:[sky1,sky2]};if(kitten&&kitten.length)o.kitten[id]=kitten});return o;}
function check(o){const p=[];Object.entries(o.scenes).forEach(([id,s])=>{if(!o.worlds[s.world])p.push(id+": unknown world");(s.choices||[]).forEach(c=>{if(c.go&&c.go!="@restart"&&!o.scenes[c.go])p.push(id+": a choice leads to a missing scene")});(s.objects||[]).forEach(b=>{if(b.puzzle&&!o.puzzles[b.puzzle])p.push(id+": object opens a missing puzzle");if(b.go&&!o.scenes[b.go])p.push(id+": object goes to a missing scene")})});if(!o.scenes[o.start])p.push("Starting scene is missing");return p;}
const say=t=>{Q("#msg").textContent=t};
Q("#pub").onclick=()=>{const o=build(),p=check(o);if(p.length){say("Fix first: "+p.slice(0,3).join("; "));return}try{localStorage.setItem("ub_story",JSON.stringify(o));ST=o;setup();dirty=false;say("Published. Open the game to see it.")}catch(e){say("Could not save in this browser.")}};
Q("#exp").onclick=()=>{const b=new Blob([JSON.stringify(build(),null,2)],{type:"application/json"}),a=el("a");a.href=URL.createObjectURL(b);a.download="the-unread-book-story.json";a.click();say("Exported.")};
Q("#imp").onclick=()=>Q("#file").click();
Q("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.scenes||!o.worlds||!o.puzzles)throw 0;ST=o;setup();sel=0;dirty=true;view();say("Imported. Press Publish to use it in the game.")}catch(x){say("That file is not a valid story export.")}})};
Q("#rs").onclick=()=>{if(confirm("Clear game progress?")){localStorage.removeItem("ub_save");say("Progress cleared.")}};
Q("#df").onclick=()=>{if(confirm("Replace everything with the default story? Export first if you want a backup.")){localStorage.removeItem("ub_story");ST=JSON.parse(JSON.stringify(window.DEFAULT_STORY));setup();sel=0;view();say("Default story restored.")}};
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
view();
</script></body></html>

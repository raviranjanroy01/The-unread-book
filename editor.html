<script>
const Q=s=>document.querySelector(s),el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e};

puzzle:[["id","Puzzle ID (no spaces)","t"],["type","Type","sel:text,choice,sequence,audiochoice"],["prompt","Question or riddle","a"],["sound","Uploaded sound clue (optional, MP3/WAV/OGG)","file:audio"],["audio","Built-in tune notes for audio choice (optional)","t"],["answers","Answers. Text: every accepted answer. Choice: the correct option. Sequence: the correct order. One per line","lines"],["options","Options for choice or sequence, one per line","lines"],["hints","Kitten hints, subtle to clear, one per line","lines"],["needs","Needs these flags before it can be tried","csv"],["locked","Message when it is not ready","t"],["wrong","Wrong answer message","t"],["win","Success message","t"],["reward","Gives flags or clues on success","csv"],["go","After solving, go to scene","sel:scenes"]],
world:[["id","World ID","t"],["name","Name","t"],["kind","Art style","sel:garden,library,pond,woods,clouds,observatory,meadow,final"],["tr","Transition into this world","sel:"+TR],["sky1","Sky top color","t"],["sky2","Sky bottom color","t"],["kitten","Kitten openers, one per line","lines"]]
};
function opts(t){const s=t.slice(4);if(s=="scenes")return["",...A.scenes.map(x=>x.id),"@restart"];if(s=="puzzles")return["",...A.puzzles.map(x=>x.id)];if(s=="worlds")return A.worlds.map(x=>x.id);return s.split(",");}
function fld(o,[k,l,t]){const w=el("label","f");w.append(el("span","",l));let i;
 if(t.startsWith("file:")){const type=t.slice(5),audio=type=="audio",limit=audio?2*1024*1024:1.5*1024*1024;i=el("input");i.type="file";i.accept=audio?"audio/mpeg,audio/wav,audio/ogg,audio/mp4,audio/x-m4a":"image/png,image/jpeg,image/gif,image/webp";w.append(el("p","upload-note",`Optional. Maximum ${audio?"2 MB":"1.5 MB"}. It is saved inside this story and its export file.`));
  if(o[k]){if(audio){const p=el("audio","upload-audio");p.controls=true;p.src=o[k];w.append(p)}else{const p=el("img","upload-preview");p.src=o[k];p.alt="Custom object preview";w.append(p)}const clear=el("button","del","Remove uploaded file");clear.type="button";clear.onclick=()=>{delete o[k];dirty=true;view()};w.append(clear)}
  i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;if(!f.type.startsWith(audio?"audio/":"image/")){say("Please choose a "+(audio?"sound":"image")+" file.");i.value="";return}if(f.size>limit){say(`That file is too large. Choose a ${audio?"sound under 2 MB":"picture under 1.5 MB"}.`);i.value="";return}const r=new FileReader();r.onload=()=>{o[k]=r.result;dirty=true;view();say("Upload added. Press Publish to use it in the game.")};r.onerror=()=>say("That file could not be read. Please try another one.");r.readAsDataURL(f)};
  w.append(i,el("p","example","Example: "+EX[k]));return w;}
 if(t=="a"){i=el("textarea");i.value=o[k]||""}
 else if(t=="b"){i=el("input");i.type="checkbox";i.checked=!!o[k]}
 else if(t=="n"){i=el("input");i.type="number";i.value=o[k]??0}
 else if(t=="csv"){i=el("input");i.type="text";i.value=(o[k]||[]).join(", ")}
 else if(t=="lines"){i=el("textarea");i.value=(o[k]||[]).join("\n")}
 else if(t.startsWith("sel:")){i=el("select");opts(t).forEach(v=>{const p=el("option","",v||"(none)");p.value=v;i.append(p)});i.value=o[k]||""}
 else{i=el("input");i.type="text";i.value=o[k]||""}
 i.placeholder=EX[k]||"Write your own idea here";
 i.oninput=i.onchange=()=>{dirty=true;o[k]=t=="b"?i.checked:t=="n"?+i.value:t=="csv"?i.value.split(",").map(s=>s.trim()).filter(Boolean):t=="lines"?i.value.split("\n").map(s=>s.trim()).filter(Boolean):i.value;};
 w.append(i,el("p","example","Example: "+(EX[k]||"Write your own idea here")));return w;}
function form(h,o,s){s.forEach(f=>h.append(fld(o,f)))}
function sub(h,arr,sch,title,mk,name){const fs=el("fieldset");fs.append(el("legend","",title));
 arr.forEach((it,i)=>{const d=el("div","sub");d.append(el("b","",name(it,i)));form(d,it,sch);const r=el("button","del","Remove");r.onclick=()=>{arr.splice(i,1);dirty=true;view()};d.append(r);fs.append(d)});
 const a=el("button","","+ Add");a.onclick=()=>{arr.push(mk());dirty=true;view()};fs.append(a);h.append(fs);}
function sceneBuilder(h,sc){const fs=el("fieldset");fs.append(el("legend","","Doodle gallery & scene layout"),el("p","gallery-help","Drag a doodle onto the scene. Drag placed doodles to move them. Click a doodle below to add it in the middle. Decorations are visual only until you turn on “Player can tap this object.”"));
 const grid=el("div","doodle-grid");Object.entries(DOODLES).forEach(([kind,emoji])=>{const b=el("button","doodle");b.type="button";b.draggable=true;b.innerHTML=`<span class="emoji">${emoji}</span><span>${kind}</span>`;b.ondragstart=e=>{e.dataTransfer.setData("text/plain",kind);e.dataTransfer.effectAllowed="copy"};b.onclick=()=>{sc.objects.push({id:"obj_"+(sc.objects.length+1),label:kind,kind,x:500,y:330,interactive:true,say:""});dirty=true;view()};grid.append(b)});fs.append(grid);
 const canvas=el("svg","scene-canvas");canvas.setAttribute("viewBox","0 0 1000 600");canvas.setAttribute("aria-label","Scene layout preview");const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));const draw=()=>{canvas.innerHTML=`<rect width="1000" height="600" fill="#4a437e"/><path d="M0 420Q180 340 350 430T700 400T1000 420V600H0Z" fill="#799c9a"/>`+(sc.objects||[]).map((o,i)=>`<g class="canvas-object${o.interactive===false?" canvas-decor":""}" data-i="${i}" transform="translate(${+o.x||500} ${+o.y||330})"><circle r="39" fill="#fff3"/><text text-anchor="middle" y="7" font-size="46">${DOODLES[o.kind]||"✨"}</text><text class="canvas-label" text-anchor="middle" y="58">${esc(o.label||o.kind)}</text></g>`).join("")};draw();
 const point=e=>{const r=canvas.getBoundingClientRect();return{x:Math.max(45,Math.min(955,Math.round((e.clientX-r.left)/r.width*1000))),y:Math.max(45,Math.min(555,Math.round((e.clientY-r.top)/r.height*600)))}};canvas.ondragover=e=>e.preventDefault();canvas.ondrop=e=>{e.preventDefault();const kind=e.dataTransfer.getData("text/plain");if(!DOODLES[kind])return;const p=point(e);sc.objects.push({id:"obj_"+(sc.objects.length+1),label:kind,kind,x:p.x,y:p.y,interactive:true,say:""});dirty=true;view()};
 let moving=null;canvas.onpointerdown=e=>{const g=e.target.closest&&e.target.closest(".canvas-object");if(!g)return;moving=+g.dataset.i;canvas.setPointerCapture(e.pointerId);e.preventDefault()};canvas.onpointermove=e=>{if(moving===null)return;const p=point(e),o=sc.objects[moving];o.x=p.x;o.y=p.y;dirty=true;draw()};canvas.onpointerup=e=>{if(moving!==null){moving=null;canvas.releasePointerCapture(e.pointerId);view()}};fs.append(canvas);h.append(fs)}
function view(){const m=Q("#main");m.innerHTML="";Q("#nav").innerHTML="";
 [["scenes","Scenes"],["puzzles","Puzzles"],["clues","Clues"],["worlds","Worlds"],["meta","Story"]].forEach(([k,n])=>{const b=el("button",tab==k?"on":"",n);b.onclick=()=>{tab=k;sel=0;view()};Q("#nav").append(b)});
 if(tab=="scenes"||tab=="puzzles"){const arr=A[tab],list=el("div","list");
  arr.forEach((it,i)=>{const b=el("button",i==sel?"on":"",it.id+(it.title?": "+it.title:""));b.onclick=()=>{sel=i;view()};list.append(b)});
  const add=el("button","","+ New "+(tab=="scenes"?"scene":"puzzle"));add.onclick=()=>{arr.push(tab=="scenes"?{id:"scene_"+(arr.length+1),world:A.worlds[0].id,title:"New scene",text:"",objects:[],choices:[]}:{id:"puzzle_"+(arr.length+1),type:"text",prompt:"",answers:[],hints:[]});sel=arr.length-1;dirty=true;view()};list.append(add);m.append(list);
  const f=el("div","form"),it=arr[sel];
  if(it){if(tab=="scenes"){form(f,it,SCH.scene);it.objects=it.objects||[];it.choices=it.choices||[];it.variants=it.variants||[];
    sub(f,it.variants,SCH.variant,"Text variants (change the text depending on earlier choices)",()=>({if:[],text:""}),(v,i)=>"Variant "+(i+1));
    sub(f,it.objects,SCH.obj,"Objects in this scene",()=>({id:"obj_"+(it.objects.length+1),label:"new thing",kind:"flower",x:500,y:480,interactive:true,say:""}),(o,i)=>o.label||o.id);sceneBuilder(f,it);
    sub(f,it.choices,SCH.choice,"Choices at the bottom",()=>({text:"New choice",go:""}),(c,i)=>c.text);
    if(it.id==ST.start)f.append(el("p","note","This is the starting scene."));}
   else form(f,it,SCH.puzzle);
   const d=el("button","del","Delete this "+(tab=="scenes"?"scene":"puzzle"));d.onclick=()=>{if(confirm("Delete "+it.id+"?")){arr.splice(sel,1);sel=0;dirty=true;view()}};f.append(d);}
  else f.append(el("p","","Nothing here yet."));m.append(f);}
 else{const f=el("div","form");m.style.gridTemplateColumns="1fr";
  if(tab=="clues"){f.append(el("p","note","One per line, written as: flag_id: what the journal says. Any flag can be a clue; it appears in the Journal once it is set."));const t=el("textarea");t.style.minHeight="320px";t.placeholder="diary_open: The diary opened for me.";t.value=Object.entries(ST.clues||{}).map(([k,v])=>k+": "+v).join("\n");t.oninput=()=>{dirty=true;ST.clues={};t.value.split("\n").forEach(l=>{const i=l.indexOf(":");if(i>0)ST.clues[l.slice(0,i).trim()]=l.slice(i+1).trim()})};f.append(t,el("p","example","Example: diary_open: The diary opened for me."))}
  if(tab=="worlds"){A.worlds.forEach(w=>{const d=el("div","sub");d.append(el("b","",w.name));form(d,w,SCH.world);f.append(d)});const a=el("button","","+ Add world");a.onclick=()=>{A.worlds.push({id:"world_"+(A.worlds.length+1),name:"New world",kind:"garden",tr:"ink",sky1:"#2b2a5e",sky2:"#d79ac0",kitten:[]});dirty=true;view()};f.append(a)}
  if(tab=="meta"){form(f,ST.meta,[["title","Book title","t"],["friendName","Your friend's name (used for {name})","t"],["from","Your name (used for {from})","t"]]);f.append(fld(ST,["start","Starting scene","sel:scenes"]));
   f.append(el("p","note","Progress and custom content live in this browser only. Use Export JSON to back up or move to another device, and Import JSON to restore it."))}
  m.append(f);}}
function build(){const o=JSON.parse(JSON.stringify(ST));o.scenes=toDict(A.scenes);o.puzzles=toDict(A.puzzles);o.worlds={};o.kitten={_:(ST.kitten||{})._||["Mrrp."]};A.worlds.forEach(({id,sky1,sky2,kitten,...w})=>{o.worlds[id]={...w,sky:[sky1,sky2]};if(kitten&&kitten.length)o.kitten[id]=kitten});return o;}
function check(o){const p=[];Object.entries(o.scenes).forEach(([id,s])=>{if(!o.worlds[s.world])p.push(id+": unknown world");(s.choices||[]).forEach(c=>{if(c.go&&c.go!="@restart"&&!o.scenes[c.go])p.push(id+": a choice leads to a missing scene")});(s.objects||[]).forEach(b=>{if(b.puzzle&&!o.puzzles[b.puzzle])p.push(id+": object opens a missing puzzle");if(b.go&&!o.scenes[b.go])p.push(id+": object goes to a missing scene")})});if(!o.scenes[o.start])p.push("Starting scene is missing");return p;}
const say=t=>{Q("#msg").textContent=t};
if(new URLSearchParams(location.search).has("new"))say("Fresh story ready. Fill in the first scene, then press Publish to the game when you are ready.");
Q("#pub").onclick=()=>{const o=build(),p=check(o);if(p.length){say("Fix first: "+p.slice(0,3).join("; "));return}try{localStorage.setItem("ub_story",JSON.stringify(o));ST=o;setup();dirty=false;say("Published. Open the game to see it.")}catch(e){say("Could not save. Uploaded media may be too large for this browser; remove a file or use smaller files.")}};
Q("#exp").onclick=()=>{const b=new Blob([JSON.stringify(build(),null,2)],{type:"application/json"}),a=el("a");a.href=URL.createObjectURL(b);a.download="the-unread-book-story.json";a.click();say("Exported.")};
Q("#imp").onclick=()=>Q("#file").click();
Q("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.scenes||!o.worlds||!o.puzzles)throw 0;ST=o;setup();sel=0;dirty=true;view();say("Imported. Press Publish to use it in the game.")}catch(x){say("That file is not a valid story export.")}})};
Q("#rs").onclick=()=>{if(confirm("Clear game progress?")){localStorage.removeItem("ub_save");say("Progress cleared.")}};
Q("#df").onclick=()=>{if(confirm("Replace everything with the default story? Export first if you want a backup.")){localStorage.removeItem("ub_story");ST=JSON.parse(JSON.stringify(window.DEFAULT_STORY));setup();sel=0;view();say("Default story restored.")}};
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
view();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Unread Book</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="bar">
    <b id="wn"></b>
    <span><button id="bj">Journal</button><button id="bs">Sound on</button><button id="br">Restart</button><a href="editor.html">Editor</a></span>
  </div>
  <div id="scene">
    <div id="art"></div>
    <div id="kb" role="status"></div>
    <button id="kit" aria-label="Ask the kitten for a hint">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g class="tail"><path d="M70 86Q98 82 90 52" stroke="#f1c9a5" stroke-width="9" fill="none" stroke-linecap="round"/></g>
        <g class="bd"><ellipse cx="50" cy="82" rx="27" ry="16" fill="#f7dcc0"/>
        <ellipse cx="36" cy="95" rx="9" ry="5" fill="#fff3e4"/><ellipse cx="64" cy="95" rx="9" ry="5" fill="#fff3e4"/></g>
        <path class="ear" d="M26 44L30 14L48 32ZM74 44L70 14L52 32Z" fill="#f1c9a5"/><path d="M31 36L32 22L41 32ZM69 36L68 22L59 32Z" fill="#f6a8c0"/>
        <circle cx="50" cy="54" r="26" fill="#f7dcc0"/>
        <g class="eye"><ellipse cx="39" cy="52" rx="5" ry="6" fill="#4a2c4f"/><circle class="pu" cx="40" cy="50" r="2" fill="#fff"/></g>
        <g class="eye"><ellipse cx="61" cy="52" rx="5" ry="6" fill="#4a2c4f"/><circle class="pu" cx="62" cy="50" r="2" fill="#fff"/></g>
        <path d="M47 61l3 3 3-3z" fill="#e88fb0"/><path d="M50 64q-3 5-7 3M50 64q3 5 7 3" stroke="#8a5a6e" fill="none" stroke-width="1.5"/>
        <path d="M20 58h12M20 64l12-2M80 58H68M80 64l-12-2" stroke="#b58a98" stroke-width="1.2"/>
        <circle cx="30" cy="62" r="4" fill="#f6a8c0" opacity=".6"/><circle cx="70" cy="62" r="4" fill="#f6a8c0" opacity=".6"/>
      </svg>
    </button>
  </div>
  <div id="panel">
    <h1 id="pt"></h1>
    <p id="px"></p>
    <p id="nar" aria-live="polite"></p>
    <div id="ch"></div>
  </div>
</div>
<div id="modal" hidden></div>
<div id="tr"></div>
<script src="story.js"></script>
<script src="engine.js"></script>
</body>
</html>
